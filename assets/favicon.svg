<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="30%" cy="22%" r="90%">
      <stop offset="0" stop-color="#22306b"/>
      <stop offset=".55" stop-color="#121a45"/>
      <stop offset="1" stop-color="#080c26"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset=".45" stop-color="#f2c94c"/>
      <stop offset="1" stop-color="#b8860b"/>
    </linearGradient>
    <radialGradient id="light" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <circle cx="32" cy="33" r="24" fill="url(#light)"/>
  <ellipse cx="22" cy="10" rx="20" ry="7" fill="#ffffff" opacity=".07"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="url(#gold)" stroke-opacity=".7" stroke-width="1.5"/>
  <text x="32" y="43" text-anchor="middle" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="32" letter-spacing="-0.5" fill="url(#gold)" filter="url(#glow)">SD</text>
</svg>
